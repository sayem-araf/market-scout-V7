name: marketscout-automation
services:
  adapter:
    build:
      context: ..
      dockerfile: n8n/Dockerfile
    environment:
      MARKETSCOUT_AUTOMATION_TOKEN: ${MARKETSCOUT_AUTOMATION_TOKEN:?Set a strong token in .env}
      MARKETSCOUT_ALLOW_LIVE: ${MARKETSCOUT_ALLOW_LIVE:-0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    # No published port. Only the dedicated Docker network can reach this service.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.6@sha256:d02752c6ab446ae9db8deec2f9cc887c378f77cdcad31650814df936b7386dfb
    ports: ["127.0.0.1:5678:5678"]
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
    volumes:
      - n8n_data:/home/node/.n8n
      - ./marketscout-review.json:/workflows/marketscout-review.json:ro
    depends_on: [adapter]
volumes:
  n8n_data:
